# Pins Streamlit's own theme to light mode with this app's palette.
#
# Without this file, Streamlit falls back to the browser/OS's preferred
# color scheme for every native widget that ui/styles.py's custom CSS
# doesn't explicitly override -- dataframe internals, expanders, disabled
# states, tooltips, and more. On a system set to dark mode, that produces
# exactly the "several boxes and text not visible in light theme" symptom:
# ui/styles.py's CSS makes the page shell light, but Streamlit's own
# components underneath were still rendering with dark-theme defaults.
# This file is the actual fix; the CSS overrides in styles.py are
# reinforcement for the handful of widgets that don't fully follow
# [theme] on their own (multiselect chips, radio dot color, etc).
#
# Values mirror ui/styles.py's COLORS dict -- if you retune the palette
# there, update these five to match.

[theme]
base = "light"
primaryColor = "#B14A24"          # COLORS["accent_marquee"]
backgroundColor = "#F0EEE4"       # COLORS["bg_primary"]
secondaryBackgroundColor = "#E7E3D4"  # COLORS["bg_surface_raised"]
textColor = "#201E18"             # COLORS["text_primary"]
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false